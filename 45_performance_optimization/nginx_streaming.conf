# 流式（SSE）透传的 Nginx 配置 —— 对应文章第 45 篇 三、流式输出的工程坑（坑1）
#
# 关键：默认 Nginx 会 buffer 响应，SSE 流式会被"吞掉"直到缓冲区满。
# 必须对流式端点关闭 buffering / cache，并透传 X-Accel-Buffering。
#
# 用法：把 /agent/stream 换成你的实际流式路由，reload nginx。

events { worker_connections 1024; }

http {
    upstream backend { server 127.0.0.1:8000; }

    # 限流区（可选）
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    server {
        listen 443 ssl http2;
        server_name agent.example.com;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # ---- 流式端点：SSE 透传 ----
        location /agent/stream {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";       # 保持长连接

            # 关键三行：关闭缓冲，SSE 才能实时下发
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header X-Accel-Buffering no;

            # SSE 长连接超时放宽
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;

            limit_req zone=api_limit burst=20 nodelay;
        }

        # ---- 普通 API ----
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }
    }

    # HTTP → HTTPS 重定向
    server {
        listen 80;
        server_name agent.example.com;
        return 301 https://$host$request_uri;
    }
}
