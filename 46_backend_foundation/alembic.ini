# Alembic 配置 —— 对应文章第 46 篇 补强5、数据库迁移管理。
# 用法：
#   alembic revision --autogenerate -m "message"
#   alembic upgrade head
#   alembic downgrade -1

[alembic]
script_location = alembic
prepend_sys_path = .
# 真实连接串从环境变量注入更安全；这里给同步 URL 作占位（迁移用同步驱动）。
sqlalchemy.url = postgresql://agent:agent@localhost:5432/agent_platform

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
