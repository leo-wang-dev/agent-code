# LLMOps 平台完整部署套件 —— 对应文章第 47 篇 四、Docker + Compose 完整部署。
# 启动：docker compose --env-file .env up -d
#       docker compose exec backend alembic upgrade head
version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agent_platform
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main
    ports: ["4000:4000"]
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    environment:
      DATABASE_URL: postgresql://agent:${DB_PASSWORD}@postgres:5432/agent_platform
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    build:
      context: ../../46_backend_foundation
      dockerfile: ../47_full_stack_llmops/deploy/Dockerfile.backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://agent:${DB_PASSWORD}@postgres:5432/agent_platform
      REDIS_URL: redis://redis:6379
      LLM_GATEWAY_URL: http://litellm:4000/v1
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      litellm: { condition: service_started }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
    ports: ["3000:80"]
    depends_on:
      backend: { condition: service_started }

  nginx:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
